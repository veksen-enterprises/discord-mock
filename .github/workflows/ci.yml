name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  # Both consumers' Node versions: sin-bot runs 22, d2armory 24. One more run installs the lowest
  # discord.js and vitest the peer ranges allow (sin-bot's versions), so the floor is tested.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: 22
          - node: 24
          - node: 22
            floor: discord.js@14.26.4 vitest@4.1.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.floor
        # npm 10's peer-set resolver crashes on vitest 4's peers (arborist #loadPeerSet,
        # "reading 'edgesOut'"); the floor job only needs these exact versions present.
        run: npm install --no-save --legacy-peer-deps ${{ matrix.floor }}
      - run: npm test
