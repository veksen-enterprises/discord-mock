name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  # Both consumers' Node versions: sin-bot runs 22, d2armory 24. One more run installs the lowest
  # discord.js and vitest the peer ranges allow (sin-bot's versions), so the floor is tested.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
          - node: 24
          - node: 22
            floor: discord.js@14.26.4 vitest@4.1.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.floor
        # Node 22's npm 10 crashes installing any vitest 4, even into an empty project
        # (arborist #loadPeerSet, "reading 'edgesOut'"); npm 11 resolves it normally.
        run: npx -y npm@11 install --no-save ${{ matrix.floor }}
      - run: npm test

  # The docs site has its own install so Astro never reaches the kit's. It still needs the kit's
  # node_modules: TypeDoc resolves discord.js's types from ../src when it builds the API reference.
  # On main, once the kit's checks pass, the build goes to Cloudflare Pages by direct upload. The
  # deploy waits for the SITE_URL repository variable, so it does nothing until Pages is set up
  # (site/README.md).
  site:
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SITE_URL != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=discordjs-test-kit --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
